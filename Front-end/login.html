<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimatti</title>
    <link rel="stylesheet" href="css/style_cadastro.css">
</head>
<body>
    <div id="container">
        <div id="card_login">
            <a href="index.html"><button id="voltar_button">Voltar</button></a>
            
            <img src="img/57546.png" alt="">
            <h2>Bem vindo!</h2>
            <p>Acesse sua conta ou cadastre-se no Dimatti!</p>
            
            <form action="">
                <label for="email"><strong>E-mail</strong></label><br>
                <div class="input_div">
                    <img class="form" src="img/email-and-mail-icon-black-free.png" alt="">
                    <input type="email" name="email" id="email" placeholder="Seu e-mail">
                </div><br>
                <label for="password"><strong>Senha</strong></label><br>
                <div class="input_div">
                    <img src="img/cadeado.png" alt="">
                    <input type="password" name="password" id="password" placeholder="Sua senha">
                </div><br>

                <button type="submit">Entrar</button>
            </form>
        </div>
        <div id="card_signin" class="escondida">
            <h1> Se cadastrar </h1>
        </div>

    </div>
</body>
</html>
